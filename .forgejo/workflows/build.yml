on:
  workflow_dispatch:
    #
  push:
    branches:
      - main

jobs:
  build:
    runs-on: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build Wheel
        run: python -m build --wheel

      - name: Get Project version
        id: get_version
        run: |
          VERSION=$(grep 'version =' pyproject.toml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish wheel as workflow artifact
        uses: actions/upload-artifact@v3
        with:
          name: wit-backup-${{ steps.get_version.outputs.version }}-${{ github.run_number }}"
          path: dist/*.whl
