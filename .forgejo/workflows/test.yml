on:
  workflow_dispatch:
    #
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: python -m pip install -e ".[dev]"
      
      - name: Run Unit Tests
        run: pytest
