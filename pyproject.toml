[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ===============================================
[project]
name = "wit-backup"
version = "1.2.1"
description = "A custom backup solution for a local fileserver with dual disk layout."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Juan Pablo Ramirez", email = "jp.ramper@gmail.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# ===============================================
dependencies = []

[project.optional-dependencies]
dev = ["build", "pytest>=7", "pytest-cov>=7"]

# ===============================================
[project.scripts]
# Format: command_name = "package.module:function"
wit-backup = "wit_backup.main:main"

# ===============================================
[tool.coverage.run]
omit = [
    "main.py",
]
